<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baran Blü — Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --baran:#371F2F;
  --petalo:#695161;
  --sarigua:#A35243;
  --platano:#1F2D1D;
  --bejuco:#B2A991;
  --yute:#BFB7A3;
  --paper:#F7F3EA;
  --paper2:#EEE7D9;
  --ink:#2C1F27;
  --ok:#E4ECD9;
  --danger:#F4DFDB;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Bricolage Grotesque",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#F0E9DD,#E8E1D4);
}
.shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 60px rgba(55,31,47,.10)}
.header{
  background:var(--baran);
  padding:22px 22px 18px;
  position:relative;
  overflow:hidden;
}
.header:after{
  content:"";position:absolute;right:-30px;bottom:-55px;width:160px;height:160px;
  border:1px solid rgba(191,183,163,.25);border-radius:50%;
}
.brand-logo{display:block;max-width:230px;width:72%;height:auto;margin:0 auto 8px;mix-blend-mode:normal}
.header-sub{color:#E9DFD4;text-align:center;font-size:13px;letter-spacing:.03em}
.main{padding:22px}
.progress{display:flex;gap:8px;margin-bottom:20px}
.progress span{height:5px;flex:1;background:#DDD3C4;border-radius:999px}
.progress span.on{background:var(--sarigua)}
.step-kicker{font-size:12px;font-weight:700;color:var(--sarigua);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
h1{font-size:30px;line-height:1.05;margin:0 0 8px;color:var(--baran)}
.lead{margin:0 0 20px;color:var(--petalo);line-height:1.45;font-size:14px}
.card{background:white;border:1px solid rgba(55,31,47,.10);border-radius:18px;padding:16px;margin-bottom:14px}
.field{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--baran)}
input,select,textarea{
  width:100%;padding:13px 14px;border:1px solid #D8CEBE;border-radius:12px;
  background:#fff;font:inherit;color:var(--ink);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--platano);box-shadow:0 0 0 3px rgba(31,45,29,.08)}
textarea{min-height:84px;resize:vertical}
.phone-grid{display:grid;grid-template-columns:110px 1fr;gap:10px}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bday-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  border:1px solid #D7CCBC;background:#fff;padding:10px 13px;border-radius:999px;
  cursor:pointer;font:inherit;font-size:13px;font-weight:600
}
.pill.active{background:var(--platano);color:#fff;border-color:var(--platano)}
.pill.disabled{opacity:.35;cursor:not-allowed}
.spaces{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.space{
  border:1px solid #D7CCBC;border-radius:14px;padding:14px;cursor:pointer;background:#fff;
}
.space.active{border:2px solid var(--platano);background:#F1F4EA}
.space.off{opacity:.35;pointer-events:none}
.space strong{display:block;color:var(--baran);margin-bottom:3px}
.space small{color:var(--petalo)}
.btn{
  width:100%;border:0;border-radius:13px;padding:15px 16px;
  background:var(--platano);color:#fff;font:inherit;font-weight:700;cursor:pointer;
}
.btn.secondary{background:transparent;color:var(--baran);border:1px solid #CDBFAE;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;line-height:1.45;color:var(--petalo);margin-top:8px}
.alert{padding:11px 12px;border-radius:10px;font-size:13px;margin:10px 0}
.alert.ok{background:var(--ok);color:#31472C}
.alert.err{background:var(--danger);color:#8E382E}
.welcome{
  background:linear-gradient(135deg,#F2E9E3,#F7F3EA);
  border:1px solid rgba(163,82,67,.20);padding:14px;border-radius:14px;margin:12px 0;
}
.checkrow{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.checkrow input{width:auto;margin-top:3px}
.checkrow label{font-weight:500;color:var(--ink);margin:0;line-height:1.4}
.link{color:var(--sarigua);text-decoration:underline;cursor:pointer;font-weight:600}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary div{background:var(--paper2);border-radius:12px;padding:12px}
.summary small{display:block;color:var(--petalo);margin-bottom:3px}
.summary strong{color:var(--baran)}
.hidden{display:none!important}
.mini{font-size:11px;color:var(--petalo)}
.privacy-box{background:#F2EEE6;padding:12px;border-radius:12px;font-size:12px;line-height:1.5;color:#5F5059}
.wa{margin-top:14px;text-align:center;font-size:13px;color:var(--petalo)}
.success{text-align:center;padding:18px 0}
.success .icon{width:64px;height:64px;border-radius:50%;background:var(--platano);color:white;display:grid;place-items:center;margin:0 auto 14px;font-size:30px}
@media(max-width:410px){.name-grid,.spaces{grid-template-columns:1fr}.phone-grid{grid-template-columns:96px 1fr}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <img src="baranblu-logo.png" alt="Baran Blü" class="brand-logo">
    <div class="header-sub">Cocina de la Tierra</div>
  </header>
  <main class="main">
    <div class="progress" id="progress"><span></span><span></span><span></span><span></span></div>
    <div id="app"></div>
  </main>
</div>

<script src="baranblu-api-adapter.js"></script>
<script>
(()=>{
const app=document.getElementById("app");
const prog=[...document.querySelectorAll("#progress span")];

const state={
  step:1,codigoPais:"+507",telefono:"",
  nombre:"",apellido:"",reconocido:false,cumpleRegistrado:false,
  personas:null,fecha:"",fechaLabel:"",hora:"",espacio:"",
  correo:"",cumpleDia:"",cumpleMes:"",
  alergias:"",guardarAlergias:false,ocasion:"",observaciones:"",
  consentimientoMarketing:false,privacidadAceptada:false,
  solicitarCumple:false,nuevoCumpleDia:"",nuevoCumpleMes:"",
  whatsapp:"",cierres:[],disponibilidad:{},resultado:null,error:"",cargando:false
};

const HORAS=["1:00pm","1:15pm","1:30pm","1:45pm","2:00pm","2:15pm","2:30pm","2:45pm","3:00pm","3:30pm","4:00pm","4:30pm","5:00pm","5:30pm","5:45pm","6:00pm","6:15pm","6:30pm","6:45pm","7:00pm","7:15pm","7:30pm","7:45pm","8:00pm","8:15pm","8:30pm"];
const ESPACIOS={
  Sala:["Sala","Mesas de 2 y 4"],
  Terraza:["Terraza","Mesas de 2 y 4"],
  Booth:["Booth","Hasta 8 puestos compartidos"],
  Bar:["Bar","Puestos en barra"]
};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function api(method,args=[]){
  return new Promise((resolve,reject)=>{
    let r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    r[method](...args);
  });
}
function setStep(n){state.step=n;prog.forEach((x,i)=>x.classList.toggle("on",i<n));render();window.scrollTo({top:0,behavior:"smooth"});}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fechaCerrada(v){
  return state.cierres.some(c=>v>=String(c.desde||"") && v<=String(c.hasta||""));
}
function proximasFechas(n=6){
  const out=[], dias=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"], meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const d=new Date(); d.setHours(12,0,0,0);
  for(let k=0;k<35 && out.length<n;k++){
    const dow=d.getDay(), v=iso(d);
    if(dow>=2 && dow<=6 && !fechaCerrada(v)) out.push({v,label:`${dias[dow]} ${d.getDate()} ${meses[d.getMonth()]}`});
    d.setDate(d.getDate()+1);
  }
  return out;
}
function err(e){state.error=(e&&e.message)||String(e||"Ocurrió un error.");state.cargando=false;render();}
function msg(){
  return state.error?`<div class="alert err">${esc(state.error)}</div>`:"";
}
function kicker(t){return `<div class="step-kicker">Paso ${state.step} de 4</div><h1>${t}</h1>`;}

async function cargarBase(){
  try{
    const [w,c]=await Promise.all([
      api("getWhatsappNumero"),
      api("getFechasCerradasPublicas")
    ]);
    state.whatsapp=w||"";
    state.cierres=Array.isArray(c)?c:[];
  }catch(e){console.warn(e);}
}
cargarBase();

function render(){
  prog.forEach((x,i)=>x.classList.toggle("on",i<state.step));
  if(state.step===1) renderIdentidad();
  if(state.step===2) renderReserva();
  if(state.step===3) renderDatos();
  if(state.step===4) renderConfirmacion();
}

function renderIdentidad(){
  app.innerHTML=`
    ${kicker("Reserva tu mesa")}
    <p class="lead">Empecemos por tu número de teléfono. Si ya nos has visitado, podremos reconocerte y hacer tu reserva más rápida.</p>
    <div class="card">
      <div class="phone-grid">
        <div class="field">
          <label>Código país</label>
          <input id="codigoPais" value="${esc(state.codigoPais)}" inputmode="tel" placeholder="+507">
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input id="telefono" value="${esc(state.telefono)}" inputmode="tel" placeholder="6000-1234">
        </div>
      </div>
      <button class="btn" id="buscarBtn">${state.cargando?"Buscando...":"Continuar"}</button>
      <div class="note">Aceptamos números internacionales. Ej.: +507, +1, +34, +57.</div>
      ${msg()}
      <div id="identityBox"></div>
    </div>
    <div class="privacy-box">Tus datos se utilizan únicamente para gestionar tu reserva y mejorar tu experiencia en Baran Blü. No vendemos ni compartimos tus datos con terceros para fines comerciales.</div>
  `;
  document.getElementById("buscarBtn").onclick=buscarTelefono;
  if(state.nombre || state.apellido || state.reconocido) mostrarIdentidad();
}

async function buscarTelefono(){
  state.codigoPais=document.getElementById("codigoPais").value.trim()||"+507";
  state.telefono=document.getElementById("telefono").value.trim();
  if(!state.telefono){state.error="Ingresa tu número de teléfono.";render();return;}
  state.error="";state.cargando=true;render();
  try{
    const r=await api("buscarClientePublico",[state.codigoPais,state.telefono]);
    state.cargando=false;
    state.reconocido=false;
    state.cumpleRegistrado=false;
    if(r.tipo==="UNICO"){
      state.nombre=r.nombre||"";
      state.cumpleRegistrado=!!r.cumpleRegistrado;
    }else if(r.tipo==="NUEVO"){
      state.nombre="";state.apellido="";
    }else{
      state.nombre="";state.apellido="";
    }
    render();
    mostrarIdentidad(r);
  }catch(e){err(e);}
}

function mostrarIdentidad(r){
  const box=document.getElementById("identityBox"); if(!box)return;
  box.innerHTML=`
    <div class="welcome">
      ${r&&r.tipo==="UNICO"?`<strong>¡Qué gusto verte de nuevo, ${esc(r.nombre)}!</strong><div class="note">Confirma tu nombre y apellido para continuar.</div>`:
      r&&r.tipo==="COMPARTIDO"?`<strong>Ya conocemos este número.</strong><div class="note">Como puede estar asociado a más de una persona, indícanos quién realiza la reserva.</div>`:
      `<strong>Completa tus datos</strong><div class="note">Nombre y apellido nos ayudan a identificar correctamente tu reserva.</div>`}
    </div>
    <div class="name-grid">
      <div class="field"><label>Nombre *</label><input id="nombre" value="${esc(state.nombre)}"></div>
      <div class="field"><label>Apellido *</label><input id="apellido" value="${esc(state.apellido)}"></div>
    </div>
    <button class="btn" id="confirmIdentidad">Continuar con la reserva</button>
  `;
  document.getElementById("confirmIdentidad").onclick=confirmarIdentidad;
}

async function confirmarIdentidad(){
  state.nombre=document.getElementById("nombre").value.trim();
  state.apellido=document.getElementById("apellido").value.trim();
  if(state.nombre.length<2||state.apellido.length<2){state.error="Completa nombre y apellido.";render();mostrarIdentidad();return;}
  state.error="";
  try{
    const r=await api("identificarClienteCompartidoPublico",[state.codigoPais,state.telefono,state.nombre,state.apellido]);
    state.reconocido=!!r.reconocido;
    state.cumpleRegistrado=!!r.cumpleRegistrado;
  }catch(e){console.warn(e);}
  setStep(2);
}

function renderReserva(){
  const fechas=proximasFechas(6);
  if(!state.fecha && fechas[0]){state.fecha=fechas[0].v;state.fechaLabel=fechas[0].label;}
  app.innerHTML=`
    ${kicker("Elige tu reserva")}
    <p class="lead">${state.reconocido?`¡Qué gusto verte de nuevo, ${esc(state.nombre)}! `:""}Selecciona personas, fecha, hora y espacio.</p>
    <div class="card">
      <div class="field"><label>Número de personas</label>
        <div class="pills">${[1,2,3,4,5,6].map(n=>`<button class="pill ${state.personas===n?"active":""}" data-p="${n}">${n}</button>`).join("")}</div>
      </div>
      <div class="field"><label>Fecha</label>
        <div class="pills">${fechas.map(f=>`<button class="pill ${state.fecha===f.v?"active":""}" data-f="${f.v}" data-l="${f.label}">${f.label}</button>`).join("")}</div>
      </div>
      <div class="field"><label>Horario de llegada</label>
        <div class="pills">${HORAS.map(h=>`<button class="pill ${state.hora===h?"active":""}" data-h="${h}">${h.replace("pm"," pm")}</button>`).join("")}</div>
      </div>
      <div class="field"><label>Espacio</label><div class="spaces" id="spaces">${Object.keys(ESPACIOS).map(k=>{
        const ok=state.disponibilidad[k]!==false;
        return `<div class="space ${state.espacio===k?"active":""} ${ok?"":"off"}" data-s="${k}"><strong>${ESPACIOS[k][0]}</strong><small>${ok?ESPACIOS[k][1]:"Sin disponibilidad"}</small></div>`;
      }).join("")}</div></div>
      ${msg()}
      <button class="btn" id="next2" ${(!state.personas||!state.fecha||!state.hora||!state.espacio)?"disabled":""}>Continuar</button>
      <button class="btn secondary" id="back2">Volver</button>
    </div>
    <div class="wa">¿Grupo de 7 o más o una solicitud especial? <span class="link" id="waLink">Escríbenos por WhatsApp.</span></div>
  `;
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{state.personas=Number(b.dataset.p);state.espacio="";state.disponibilidad={};renderReserva();cargarDisponibilidad();});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{state.fecha=b.dataset.f;state.fechaLabel=b.dataset.l;state.espacio="";state.disponibilidad={};renderReserva();cargarDisponibilidad();});
  document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{state.hora=b.dataset.h;state.espacio="";state.disponibilidad={};renderReserva();cargarDisponibilidad();});
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{if(!b.classList.contains("off")){state.espacio=b.dataset.s;renderReserva();}});
  document.getElementById("next2").onclick=()=>setStep(3);
  document.getElementById("back2").onclick=()=>setStep(1);
  document.getElementById("waLink").onclick=()=>{
    const n=String(state.whatsapp||"").replace(/\D/g,""); if(n) window.open(`https://wa.me/${n}`,"_blank");
  };
  if(state.personas&&state.fecha&&state.hora&&Object.keys(state.disponibilidad).length===0)cargarDisponibilidad();
}

async function cargarDisponibilidad(){
  if(!state.personas||!state.fecha||!state.hora)return;
  try{
    const r=await api("getDisponibilidad",[state.fecha,state.hora,state.personas]);
    state.disponibilidad=r||{};
    if(state.espacio && state.disponibilidad[state.espacio]===false)state.espacio="";
    renderReserva();
  }catch(e){err(e);}
}

function renderDatos(){
  app.innerHTML=`
    ${kicker("Completa tus datos")}
    <p class="lead">Solo pedimos la información necesaria para atender tu reserva.</p>
    <div class="card">
      <div class="field"><label>Correo electrónico *</label><input type="email" id="correo" value="${esc(state.correo)}" placeholder="tu@correo.com"></div>

      ${state.cumpleRegistrado?`
        <div class="welcome"><strong>🎂 Tenemos tu cumpleaños registrado.</strong>
          <div class="note">¿La fecha no es correcta? <span class="link" id="solicitarCumpleLink">Solicitar actualización</span>.</div>
        </div>
        <div id="cumpleCorreccion" class="${state.solicitarCumple?"":"hidden"}">
          <label>Fecha correcta solicitada</label>
          <div class="bday-grid">
            <select id="nuevoCumpleDia"><option value="">Día</option>${Array.from({length:31},(_,i)=>`<option ${String(i+1)===String(state.nuevoCumpleDia)?"selected":""}>${i+1}</option>`).join("")}</select>
            <select id="nuevoCumpleMes"><option value="">Mes</option>${["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].map((m,i)=>`<option value="${i+1}" ${String(i+1)===String(state.nuevoCumpleMes)?"selected":""}>${m}</option>`).join("")}</select>
          </div>
          <div class="note">Administración revisará la solicitud antes de modificar tu ficha.</div>
        </div>
      `:`
        <div class="field"><label>Cumpleaños <span class="mini">(opcional)</span></label>
          <div class="bday-grid">
            <select id="cumpleDia"><option value="">Día</option>${Array.from({length:31},(_,i)=>`<option ${String(i+1)===String(state.cumpleDia)?"selected":""}>${i+1}</option>`).join("")}</select>
            <select id="cumpleMes"><option value="">Mes</option>${["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].map((m,i)=>`<option value="${i+1}" ${String(i+1)===String(state.cumpleMes)?"selected":""}>${m}</option>`).join("")}</select>
          </div>
          <div class="note">Nos ayuda a celebrar contigo en fechas especiales.</div>
        </div>
      `}

      <div class="field"><label>Alergias o restricciones para esta reserva <span class="mini">(opcional)</span></label>
        <textarea id="alergias" placeholder="Ej.: alergia a mariscos">${esc(state.alergias)}</textarea>
      </div>
      <div class="checkrow"><input type="checkbox" id="guardarAlergias" ${state.guardarAlergias?"checked":""}><label for="guardarAlergias">Guardar esta información para futuras reservas.</label></div>

      <div class="field"><label>Ocasión especial <span class="mini">(opcional)</span></label><input id="ocasion" value="${esc(state.ocasion)}" placeholder="Cumpleaños, aniversario..."></div>
      <div class="field"><label>Observaciones <span class="mini">(opcional)</span></label><textarea id="observaciones">${esc(state.observaciones)}</textarea></div>

      <div class="checkrow"><input type="checkbox" id="marketing" ${state.consentimientoMarketing?"checked":""}><label for="marketing">Quiero recibir novedades y beneficios de Baran Blü.</label></div>
      <div class="checkrow"><input type="checkbox" id="privacidad" ${state.privacidadAceptada?"checked":""}><label for="privacidad">Acepto la <span class="link" id="privacyLink">Política de Privacidad</span> y el uso de mis datos para gestionar esta reserva. *</label></div>

      <div class="privacy-box" id="privacyText" style="display:none">
        Baran Blü utiliza los datos proporcionados para gestionar reservas, atención al cliente y, solo cuando lo autorizas, comunicaciones comerciales. No vendemos tus datos ni los compartimos con terceros para fines comerciales. Puedes solicitar acceso, corrección o eliminación de tus datos contactando al restaurante.
      </div>

      ${msg()}
      <button class="btn" id="next3">Revisar reserva</button>
      <button class="btn secondary" id="back3">Volver</button>
    </div>
  `;
  const q=id=>document.getElementById(id);
  q("privacyLink").onclick=()=>{const x=q("privacyText");x.style.display=x.style.display==="none"?"block":"none";};
  if(q("solicitarCumpleLink"))q("solicitarCumpleLink").onclick=()=>{state.solicitarCumple=true;renderDatos();};
  q("next3").onclick=()=>{
    state.correo=q("correo").value.trim();
    if(!state.cumpleRegistrado){state.cumpleDia=q("cumpleDia").value;state.cumpleMes=q("cumpleMes").value;}
    if(state.solicitarCumple){state.nuevoCumpleDia=q("nuevoCumpleDia").value;state.nuevoCumpleMes=q("nuevoCumpleMes").value;}
    state.alergias=q("alergias").value.trim();state.guardarAlergias=q("guardarAlergias").checked;
    state.ocasion=q("ocasion").value.trim();state.observaciones=q("observaciones").value.trim();
    state.consentimientoMarketing=q("marketing").checked;state.privacidadAceptada=q("privacidad").checked;
    if(!state.correo||!state.correo.includes("@")){state.error="Ingresa un correo válido.";renderDatos();return;}
    if(!state.privacidadAceptada){state.error="Debes aceptar la Política de Privacidad para continuar.";renderDatos();return;}
    if(state.solicitarCumple && (!state.nuevoCumpleDia||!state.nuevoCumpleMes)){state.error="Indica la fecha de cumpleaños correcta.";renderDatos();return;}
    state.error="";renderRevision();
  };
  q("back3").onclick=()=>setStep(2);
}

function renderRevision(){
  app.innerHTML=`
    ${kicker("Revisa tu reserva")}
    <p class="lead">Confirma que todo esté correcto antes de reservar.</p>
    <div class="card">
      <div class="summary">
        <div><small>Cliente</small><strong>${esc(state.nombre)} ${esc(state.apellido)}</strong></div>
        <div><small>Personas</small><strong>${state.personas}</strong></div>
        <div><small>Fecha</small><strong>${esc(state.fechaLabel||state.fecha)}</strong></div>
        <div><small>Hora</small><strong>${esc(state.hora.replace("pm"," pm"))}</strong></div>
        <div><small>Espacio</small><strong>${esc(state.espacio)}</strong></div>
        <div><small>Teléfono</small><strong>${esc(state.codigoPais)} ${esc(state.telefono)}</strong></div>
      </div>
      ${msg()}
      <button class="btn" id="confirmarReserva">${state.cargando?"Reservando...":"Confirmar reserva"}</button>
      <button class="btn secondary" id="editar">Volver y revisar</button>
    </div>
  `;
  document.getElementById("confirmarReserva").onclick=enviarReserva;
  document.getElementById("editar").onclick=()=>renderDatos();
}

async function enviarReserva(){
  if(state.cargando)return;
  state.cargando=true;state.error="";renderRevision();
  const datos={
    fecha:state.fecha,hora:state.hora,espacio:state.espacio,personas:state.personas,
    nombre:state.nombre,apellido:state.apellido,codigoPais:state.codigoPais,telefono:state.telefono,
    correo:state.correo,cumpleDia:state.cumpleRegistrado?"":state.cumpleDia,cumpleMes:state.cumpleRegistrado?"":state.cumpleMes,
    alergias:state.alergias,guardarAlergias:state.guardarAlergias,
    ocasion:state.ocasion,observaciones:state.observaciones,
    consentimientoMarketing:state.consentimientoMarketing,
    privacidadAceptada:state.privacidadAceptada,canal:"Web"
  };
  try{
    const r=await api("crearReservaV2",[datos]);
    if(!r||!r.exito)throw new Error((r&&r.mensaje)||"No se pudo crear la reserva.");
    state.resultado=r;
    if(state.solicitarCumple){
      try{
        await api("solicitarCorreccionCumple",[{
          codigoPais:state.codigoPais,telefono:state.telefono,nombre:state.nombre,apellido:state.apellido,
          cumpleDia:state.nuevoCumpleDia,cumpleMes:state.nuevoCumpleMes,privacidadAceptada:true
        }]);
      }catch(e){console.warn("Reserva creada; solicitud de cumpleaños no enviada",e);}
    }
    state.cargando=false;setStep(4);
  }catch(e){state.cargando=false;err(e);renderRevision();}
}

function renderConfirmacion(){
  app.innerHTML=`
    <div class="success">
      <div class="icon">✓</div>
      <h1>¡Reserva confirmada!</h1>
      <p class="lead">Gracias, ${esc(state.nombre)}. Tu mesa quedó registrada.</p>
    </div>
    <div class="card">
      <div class="summary">
        <div><small>Código</small><strong>${esc(state.resultado&&state.resultado.id)}</strong></div>
        <div><small>Personas</small><strong>${state.personas}</strong></div>
        <div><small>Fecha</small><strong>${esc(state.fechaLabel||state.fecha)}</strong></div>
        <div><small>Hora</small><strong>${esc(state.hora.replace("pm"," pm"))}</strong></div>
        <div><small>Espacio</small><strong>${esc(state.espacio)}</strong></div>
      </div>
      <div class="note" style="margin-top:12px">Te enviamos la confirmación al correo registrado.</div>
      ${state.solicitarCumple?`<div class="alert ok">También enviamos tu solicitud de actualización de cumpleaños a Administración.</div>`:""}
    </div>
  `;
}
render();
})();
</script>
</body>
</html>
