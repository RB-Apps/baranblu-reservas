  :root{
    /* Paleta oficial Baran Blü — Brand Guidelines, julio 2026 */
    --wine:#371F2F;       /* Baran Blü — color ancla, títulos */
    --petalo:#695161;     /* texto secundario / muted */
    --sarigua:#A35243;    /* acento cálido */
    --platano:#1F2D1D;    /* acento tierra / verde, CTAs */
    --bejuco:#B2A991;     /* neutro cálido medio */
    --yute:#BFB7A3;       /* neutro cálido claro */

    /* Alias internos (mantienen el resto del código sin tocar) */
    --sage:#1F2D1D;
    --sage-dark:#1F2D1D;
    --gold:#A35243;
    --navy:#371F2F;
    --paper:#F5F2EA;
    --paper-muted:#EDE7D9;
    --ink:#2C1F27;
    --text-muted:#695161;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#E8E5DB;
    font-family:'Bricolage Grotesque',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:24px 12px;
  }
  #proto-root{width:100%;max-width:400px;}
  .frame{
    background:var(--paper);
    border-radius:28px;
    box-shadow:0 20px 60px rgba(31,42,36,0.18);
    overflow:hidden;
    min-height:640px;
    display:flex;
    flex-direction:column;
  }
  .frame-top{padding:18px 22px 0 22px;}
  .vine-row{display:flex;align-items:center;gap:10px;}
  .vine-svg{flex:1;height:14px;}
  .step-label{font-size:11px;color:var(--text-muted);letter-spacing:0.04em;white-space:nowrap;}
  #screenHost{flex:1;padding:18px 24px 24px 24px;}
  .screen{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px;}
  .brand{font-family:'Mencken Std Narrow',serif;font-size:34px;font-weight:400;margin:0 0 8px 0;color:var(--sage-dark);}
  .screen-title{font-family:'Mencken Std Narrow',serif;font-size:27px;font-weight:400;margin:4px 0 6px 0;color:var(--sage-dark);}
  .desc{font-size:14px;color:var(--text-muted);line-height:1.5;margin:0 0 22px 0;}
  .field-label{font-size:12.5px;font-weight:600;color:var(--ink);margin:16px 0 8px 0;}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    padding:10px 16px;border-radius:999px;border:1.5px solid rgba(31,42,36,0.18);
    background:var(--paper);font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .pill.selected{background:var(--sage);border-color:var(--sage);color:white;}
  .pill.disabled{opacity:0.35;pointer-events:none;}
  .space-card{
    border:1.5px solid rgba(31,42,36,0.14);border-radius:16px;padding:14px 16px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .space-card.selected{border-color:var(--sage);background:rgba(92,107,84,0.08);}
  .space-card.unavailable{opacity:0.35;pointer-events:none;}
  .space-name{font-weight:600;font-size:15px;}
  .space-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .space-badge{font-size:11px;color:var(--sage);font-weight:600;}
  input[type=text], input[type=tel], input[type=email], textarea{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(31,42,36,0.16);
    font-family:'Bricolage Grotesque',sans-serif;font-size:14px;background:var(--paper);margin-bottom:10px;
  }
  textarea{resize:none;min-height:56px;}
  .avail-card{background:var(--paper-muted);border-radius:14px;padding:16px;margin:14px 0;}
  .avail-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;}
  .avail-row span:first-child{color:var(--text-muted);}
  .avail-row span:last-child{font-weight:600;}
  .policy-note{font-size:12px;color:var(--text-muted);text-align:center;margin-top:14px;line-height:1.5;}
  .cta-bar{margin-top:22px;}
  .cta-btn{
    width:100%;background:var(--sage-dark);color:var(--paper);border:none;border-radius:14px;
    padding:16px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;
  }
  .cta-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .cta-btn.secondary{background:transparent;color:var(--ink);border:1.5px solid rgba(31,42,36,0.25);margin-top:8px;}
  .back-link{font-size:12.5px;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin-bottom:16px;}
  .method-row{display:flex;gap:10px;}
  .method-card{
    flex:1;border:1.5px solid rgba(31,42,36,0.16);border-radius:14px;padding:14px;text-align:center;cursor:pointer;
  }
  .method-card.selected{border-color:var(--sage);background:rgba(92,107,84,0.08);}
  .method-card .m-title{font-weight:600;font-size:14px;}
  .method-card .m-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .bank-card{background:var(--paper-muted);border-radius:14px;padding:16px;margin:14px 0;}
  .bank-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed rgba(31,42,36,0.1);}
  .bank-row:last-child{border-bottom:none;}
  .wa-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:white;
    border-radius:14px;padding:14px;font-weight:600;font-size:14px;margin-top:14px;cursor:pointer;
    text-decoration:none;
  }
  .pending-icon{
    width:56px;height:56px;border-radius:50%;background:var(--gold);display:flex;align-items:center;
    justify-content:center;margin:0 auto 18px auto;
  }
  .confirm-icon{
    width:56px;height:56px;border-radius:50%;background:var(--sage);display:flex;align-items:center;
    justify-content:center;margin:0 auto 18px auto;
  }
  .wa-card{background:var(--paper-muted);border-radius:14px;padding:20px;text-align:center;}
  .proto-tag{text-align:center;color:#9CA79A;font-size:11px;margin-top:14px;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:0.05em;}
  .error-note{background:#F7E3E0;color:#9A3B2E;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
  .loading-note{text-align:center;font-size:13px;color:var(--text-muted);padding:20px 0;}
  .spinner{
    width:22px;height:22px;border:3px solid rgba(92,107,84,0.2);border-top-color:var(--sage);
    border-radius:50%;margin:0 auto 10px auto;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="proto-root">
  <div class="frame">
    <div class="frame-top">
      <div class="vine-row">
        <svg class="vine-svg" viewBox="0 0 300 14" id="vineSvg">
          <path d="M2,7 Q40,2 78,7 T154,7 T230,7 T298,7" fill="none" stroke="rgba(217,164,65,0.25)" stroke-width="2"/>
          <path id="vineFill" d="M2,7 Q40,2 78,7 T154,7 T230,7 T298,7" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="step-label" id="stepLabel">Paso 1 de 4</span>
      </div>
    </div>
    <div id="screenHost"></div>

</div>

    metodoPago: null,
    nombre: "", telefono: "", correo: "", alergias: "", ocasion: "",
    disponibilidad: {}, // resultado real de getDisponibilidad
    reservaResultado: null,
    cargando: false,
    error: null,
    whatsappNumero: null,
    requiereDeposito: null,
    fechasCerradas: []
  };

  const ESPACIOS_INFO = {
    Bar: {nombre:"Bar", sub:"4 puestos en barra"},
    Booth: {nombre:"Booth", sub:"Sillón + 4 sillas · hasta 8"},
    Sala: {nombre:"Sala", sub:"Mesas de 2 y 4"},
    Terraza: {nombre:"Terraza", sub:"Mesas de 2 y 4"}
  };

  const HORAS = [
    "1:00pm","1:15pm","1:30pm","1:45pm",
    "2:00pm","2:15pm","2:30pm","2:45pm","3:00pm",
    "3:30pm","4:00pm","4:30pm","5:00pm",
    "5:30pm","5:45pm",
    "6:00pm","6:15pm","6:30pm","6:45pm",
    "7:00pm","7:15pm","7:30pm","7:45pm",
    "8:00pm","8:15pm","8:30pm"
  ];

  function normalizarWhatsapp(numero){
    return String(numero || '').replace(/\D/g, '');
  }

  // ---------- Fechas reales: próximos días martes a sábado ----------
  function getProximasFechas(cantidad){
    const dias = [];
    const nombresDia = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
    const nombresMes = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    let d = new Date();
    while(dias.length < cantidad){
      const diaSemana = d.getDay(); // 0=Dom ... 6=Sáb
      if(diaSemana >= 2 && diaSemana <= 6){ // martes(2) a sábado(6)
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth()+1).padStart(2,"0");
        const dd = String(d.getDate()).padStart(2,"0");
        dias.push({
          valor: `${yyyy}-${mm}-${dd}`,
          label: `${nombresDia[diaSemana]} ${d.getDate()} ${nombresMes[d.getMonth()]}`
        });
      }
      d = new Date(d.getTime() + 24*60*60*1000);
    }
    return dias;
  }
  let FECHAS = getProximasFechas(6);

  function fechaEnCierre_(fecha, cierres){
    return (cierres || []).some(c => fecha >= c.desde && fecha <= c.hasta);
  }

  function reconstruirFechasDisponibles_(){
    FECHAS = getProximasFechas(20)
      .filter(f => !fechaEnCierre_(f.valor, state.fechasCerradas))
      .slice(0, 6);
  }

  function getProgresoVisible(step){
    if(step === 8){
      return { contacto: true, actual: 1, total: 1 };
    }
    return {
      contacto: false,
      actual: Math.min(step, 4),
      total: 4
    };
  }

  function setVine(actual, total){
    const pct = Math.min(actual/total, 1);
    vineFill.style.strokeDashoffset = totalLen * (1 - pct);
  }

  function actualizarIndicador(){
    const progreso = getProgresoVisible(state.step);
    if(progreso.contacto){
      stepLabel.textContent = "Contacto directo";
      setVine(1, 1);
      return;
    }
    stepLabel.textContent = `Paso ${progreso.actual} de ${progreso.total}`;
    setVine(progreso.actual, progreso.total);
  }

  function go(step){
    state.step = step;
    state.error = null;
    actualizarIndicador();

    if(step === 8 && !state.whatsappNumero){
      render();
      google.script.run
        .withSuccessHandler(function(numero){
          state.whatsappNumero = numero;
          render();
        })
        .withFailureHandler(function(){
          render();
        })
        .getWhatsappNumero();
      return;
    }
    render();
  }

  function render(){
    const screens = {1:screen1,2:screen2,3:screen3,4:screen4,8:screenAlt};
    host.innerHTML = (screens[state.step] || screen1)();
    bind();
  }

  function screen1(){
    return `
      <div class="screen" style="padding-top:36px;">
        <div class="eyebrow">Baran Blü · cocina de la tierra</div>
        <h1 class="brand">Reserva tu mesa</h1>
        <p class="desc">Elige cuántos son y te mostramos la disponibilidad real.</p>
        <div class="field-label">¿Cuántas personas?</div>
        <div class="pill-row" id="personasRow">
          ${[1,2,3,4,5,6].map(n=>`<div class="pill" data-p="${n}">${n}</div>`).join("")}
          <div class="pill" data-p="7">7+</div>
        </div>
        <div class="cta-bar">
          <button class="cta-btn" id="continueBtn" disabled>Continuar</button>
        </div>
      </div>`;
  }

  function screen2(){
    return `
      <div class="screen">
        <div class="back-link" data-go="1">← Volver</div>
        <h2 class="screen-title">Fecha, hora y espacio</h2>
        <p class="desc">Martes a sábado · 1:00pm a 8:30pm (última reserva)</p>
        <div class="field-label">Fecha</div>
        <div class="pill-row" id="fechaRow">
          ${FECHAS.map(f=>`<div class="pill" data-f="${f.valor}">${f.label}</div>`).join("")}
        </div>
        <div class="field-label">Hora</div>
        <div class="pill-row" id="horaRow">
          ${HORAS.map(h=>`<div class="pill" data-h="${h}">${h}</div>`).join("")}
        </div>
        <div class="field-label">Espacio</div>
        <div id="espaciosList">
          <div class="loading-note" id="espaciosLoading" style="display:none;">
            <div class="spinner"></div>Consultando disponibilidad…
          </div>
          <div id="espaciosCards"></div>
        </div>
        ${state.error ? `<div class="error-note">${state.error}</div>` : ""}
        <div class="cta-bar">
          <button class="cta-btn" id="continueBtn2" disabled>Continuar</button>
        </div>
      </div>`;
  }

  function screen3(){
    return `
      <div class="screen">
        <div class="back-link" data-go="2">← Volver</div>
        <h2 class="screen-title">Tus datos</h2>
        <p class="desc">Para confirmar tu reserva y avisarte cualquier cambio.</p>
        <input type="text" placeholder="Nombre completo" id="nombreInput" value="${state.nombre}">
        <input type="tel" placeholder="Teléfono" id="telInput" value="${state.telefono}">
        <input type="email" placeholder="Correo electrónico" id="correoInput" value="${state.correo}">
        <textarea placeholder="Alergias o restricciones (opcional)" id="alergiasInput">${state.alergias}</textarea>
        <textarea placeholder="¿Alguna ocasión especial? (opcional)" id="ocasionInput">${state.ocasion}</textarea>
        ${state.error ? `<div class="error-note">${state.error}</div>` : ""}
        ${state.cargando ? `<div class="loading-note"><div class="spinner"></div>Procesando tu reserva…</div>` : ""}
        <div class="cta-bar">
          <button class="cta-btn" id="continueBtn3" ${state.cargando ? "disabled" : ""}>${state.cargando ? "Procesando…" : "Continuar"}</button>
        </div>
      </div>`;
  }

  function screen4(){
    const sinPago = state.metodoPago === "Sin pago";
    return `
      <div class="screen" style="text-align:center;padding-top:40px;">
        <div class="confirm-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><path d="M4 12l5 5L20 6"/></svg>
        </div>
        <h2 class="screen-title">¡Reserva confirmada!</h2>
        <p class="desc">Te esperamos en Baran Blü. Te enviamos los detalles a tu correo.</p>
        <div class="avail-card" style="text-align:left;">
          <div class="avail-row"><span>Fecha</span><span>${state.fechaLabel}</span></div>
          <div class="avail-row"><span>Hora</span><span>${state.hora}</span></div>
          <div class="avail-row"><span>Espacio</span><span>${ESPACIOS_INFO[state.espacio].nombre}</span></div>
          <div class="avail-row"><span>Personas</span><span>${state.personas}</span></div>
        </div>
        <div class="policy-note">15 min de tolerancia</div>
        <div class="cta-bar">
          <button class="cta-btn secondary" data-go="1">Volver al inicio</button>
        </div>
      </div>`;
  }

  function screenAlt(){
    const numero = state.whatsappNumero;
    const waLink = numero
      ? `https://wa.me/${normalizarWhatsapp(numero)}?text=${encodeURIComponent('Hola, quiero reservar una mesa para un grupo de 7 o más personas en Baran Blü.')}`
      : null;
    return `
      <div class="screen" style="text-align:center;padding-top:44px;">
        <div class="eyebrow">Grupos de 7 o más</div>
        <h2 class="screen-title">Escríbenos directo</h2>
        <p class="desc">Para grupos grandes o eventos privados, coordinamos contigo por WhatsApp.</p>
        ${waLink
          ? `<a class="wa-btn" href="${waLink}" target="_blank" rel="noopener noreferrer">Escríbenos por WhatsApp</a>`
          : `<div class="loading-note"><div class="spinner"></div>Cargando…</div>`}
        <div class="cta-bar">
          <button class="cta-btn secondary" data-go="1">Volver al inicio</button>
        </div>
      </div>`;
  }

  // ---------- Lógica conectada al backend ----------

  function consultarDisponibilidad(){
    const espaciosLoading = document.getElementById("espaciosLoading");
    const espaciosCards = document.getElementById("espaciosCards");
    if(!state.fecha || !state.hora) return;
    espaciosLoading.style.display = "block";
    espaciosCards.innerHTML = "";

    google.script.run
      .withSuccessHandler(function(disponibilidad){
        state.disponibilidad = disponibilidad || {};
        espaciosLoading.style.display = "none";
        pintarEspacios();
      })
      .withFailureHandler(function(err){
        espaciosLoading.style.display = "none";
        state.error = "No pudimos consultar disponibilidad. Intenta de nuevo.";
        render();
      })
      .getDisponibilidad(state.fecha, state.hora, state.personas);
  }

  function pintarEspacios(){
    const espaciosCards = document.getElementById("espaciosCards");
    if(!espaciosCards) return;
    espaciosCards.innerHTML = Object.keys(ESPACIOS_INFO).map(id=>{
      const info = ESPACIOS_INFO[id];
      const disp = state.disponibilidad[id];
      return `
        <div class="space-card ${disp ? "" : "unavailable"}" data-e="${id}">
          <div>
            <div class="space-name">${info.nombre}</div>
            <div class="space-sub">${info.sub}</div>
          </div>
          <div class="space-badge">${disp ? "Disponible" : "Sin cupo"}</div>
        </div>`;
    }).join("");
    espaciosCards.querySelectorAll(".space-card").forEach(card=>{
      card.addEventListener("click", ()=>{
        espaciosCards.querySelectorAll(".space-card").forEach(c=>c.classList.remove("selected"));
        card.classList.add("selected");
        state.espacio = card.dataset.e;
        document.getElementById("continueBtn2").disabled = false;
      });
    });
  }

  function enviarReserva(){
    state.cargando = true;
    state.error = null;
    render();

    google.script.run
      .withSuccessHandler(function(resultado){
        state.cargando = false;
        if(!resultado.exito){
          state.error = resultado.mensaje || "No se pudo crear la reserva.";
          render();
          return;
        }
        state.reservaResultado = resultado;
        go(4);
      })
      .withFailureHandler(function(err){
        state.cargando = false;
        state.error = "Ocurrió un error al reservar. Intenta de nuevo.";
        render();
      })
      .crearReserva({
        fecha: state.fecha,
        hora: state.hora,
        espacio: state.espacio,
        personas: state.personas,
        nombre: state.nombre,
        telefono: state.telefono,
        correo: state.correo,
        alergias: state.alergias,
        ocasion: state.ocasion,
        metodoPago: state.metodoPago
      });
  }


  function bind(){
    host.querySelectorAll("[data-go]").forEach(el=>{
      el.addEventListener("click", ()=> go(parseInt(el.dataset.go)));
    });

    // Pantalla 1: personas
    const personasRow = document.getElementById("personasRow");
    if(personasRow){
      personasRow.querySelectorAll(".pill").forEach(p=>{
        p.addEventListener("click", ()=>{
          personasRow.querySelectorAll(".pill").forEach(x=>x.classList.remove("selected"));
          p.classList.add("selected");
          state.personas = p.dataset.p === "7" ? "7+" : parseInt(p.dataset.p);
          document.getElementById("continueBtn").disabled = false;
        });
      });
    }
    const continueBtn = document.getElementById("continueBtn");
    if(continueBtn){
      continueBtn.addEventListener("click", ()=>{
        if(state.personas === "7+") go(8);
        else go(2);
      });
    }

    // Pantalla 2: fecha + hora + espacio
    const fechaRow = document.getElementById("fechaRow");
    if(fechaRow){
      fechaRow.querySelectorAll(".pill").forEach(p=>{
        p.addEventListener("click", ()=>{
          fechaRow.querySelectorAll(".pill").forEach(x=>x.classList.remove("selected"));
          p.classList.add("selected");
          state.fecha = p.dataset.f;
          const match = FECHAS.find(f=>f.valor === p.dataset.f);
          state.fechaLabel = match ? match.label : p.dataset.f;
          if(state.hora) consultarDisponibilidad();
        });
      });
    }
    const horaRow = document.getElementById("horaRow");
    if(horaRow){
      horaRow.querySelectorAll(".pill").forEach(p=>{
        p.addEventListener("click", ()=>{
          horaRow.querySelectorAll(".pill").forEach(x=>x.classList.remove("selected"));
          p.classList.add("selected");
          state.hora = p.dataset.h;
          if(state.fecha) consultarDisponibilidad();
        });
      });
    }
    const continueBtn2 = document.getElementById("continueBtn2");
    if(continueBtn2){
      continueBtn2.addEventListener("click", ()=> go(3));
    }

    // Pantalla 3: datos del cliente
    const continueBtn3 = document.getElementById("continueBtn3");
    if(continueBtn3){
      continueBtn3.addEventListener("click", ()=>{
        if(state.cargando) return;
        state.nombre = document.getElementById("nombreInput").value.trim();
        state.telefono = document.getElementById("telInput").value.trim();
        state.correo = document.getElementById("correoInput").value.trim();
        state.alergias = document.getElementById("alergiasInput").value.trim();
        state.ocasion = document.getElementById("ocasionInput").value.trim();
        if(!state.nombre || !state.telefono || !state.correo){
          state.error = "Completa nombre, teléfono y correo para continuar.";
          render();
          return;
        }
        state.metodoPago = "Sin pago";
        enviarReserva();
      });
    }

  }

  go(1);

  state.requiereDeposito = false;

  google.script.run
    .withSuccessHandler(function(cierres){
      state.fechasCerradas = cierres || [];
      reconstruirFechasDisponibles_();
      if(state.step === 2) render();
    })
    .withFailureHandler(function(){
      state.fechasCerradas = [];
    })
    .getFechasCerradasPublicas();

  actualizarIndicador();
})();
</script>
</body>
</html>
